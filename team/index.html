<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organisers | OffGrid Delhi</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Single+Day&family=Inter:wght@400;500&display=swap">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: "Single Day", cursive;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 14px 20px;
      background: rgba(0, 0, 0, 0.9);
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 1.4rem;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .nav-spacer {
      flex: 1;
    }

    .register {
      border: 2px solid #d71f04;
      padding: 6px 16px;
    }

    main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 35px 20px 60px;
    }

    .organisers-logo {
      display: block;
      width: min(100%, 1100px);
      height: auto;
      margin: 0 auto 35px;
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(min(100%, 260px), 320px)
      );
      justify-content: center;
      gap: 22px;
    }

    .team-card {
      min-width: 0;
      background: #0b0b0b;
      border: 1px solid #292929;
    }

    .team-card img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      background: #111;
    }

    .team-info {
      padding: 16px 18px 20px;
    }

    .team-info h2 {
      margin: 0 0 8px;
      font-size: 1.8rem;
      font-weight: 400;
    }

    .team-info a {
      color: #aaa;
      font: 400 1rem/1.5 Inter, sans-serif;
      overflow-wrap: anywhere;
      text-decoration: none;
    }

    .team-info a:hover {
      color: #fff;
      text-decoration: underline;
    }

    @media (max-width: 520px) {
      nav {
        gap: 14px;
        padding: 12px;
      }

      nav a {
        font-size: 1.1rem;
      }

      main {
        padding: 25px 14px 40px;
      }

      .team-grid {
        gap: 14px;
      }
    }
  </style>
</head>

<body>
  <nav>
    <a href="/">Home</a>
    <a href="/#faq">FAQ</a>
    <span class="nav-spacer"></span>
    <a class="register" href="/register">Register</a>
  </nav>

  <main>
    <!-- SVG heading: keep organizers.svg in this same folder -->
    <img
      class="organisers-logo"
      src="./organizers.svg"
      alt="Organisers"
    >

    <section class="team-grid" aria-label="Organisers">
      <article class="team-card">
        <img
          src="/utkarsh.png"
          alt="Utkarsh Saraswat"
          onerror="if (!this.dataset.fallback) { this.dataset.fallback='1'; this.src='/utkarsh.jpg'; } else { this.style.display='none'; }"
        >

        <div class="team-info">
          <h2>Utkarsh Saraswat</h2>
          <a href="mailto:Buildwithutkarsh@gmail.com">
            Buildwithutkarsh@gmail.com
          </a>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
